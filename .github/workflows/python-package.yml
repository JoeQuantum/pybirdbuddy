name: Python package

on:
  push:
  pull_request:
  schedule:
    - cron: "30 16 * * MON"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.20", "3.14.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -r requirements.test.txt
      - name: Test source
        run: python -m pytest
      - name: Build and check package metadata
        run: |
          python -m build
          python -m twine check dist/*
      - name: Test installed wheel outside the source tree
        run: |
          python -m pip uninstall -y pybirdbuddy
          python -m pip install --no-deps dist/*.whl
          mkdir -p /tmp/birdbuddy-wheel-tests
          cp -R tests /tmp/birdbuddy-wheel-tests/tests
          cp -R scripts /tmp/birdbuddy-wheel-tests/scripts
          cd /tmp/birdbuddy-wheel-tests
          python -m pytest tests --asyncio-mode=auto

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14.4"
      - run: python -m pip install -r requirements.test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright --pythonpath "$(command -v python)" --warnings
